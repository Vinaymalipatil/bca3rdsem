<html>
    <head>
        <title>nested list</title>
    </head>
    <body>
        <h1>Nested list</h1>
        <ol>
            <li>Land transport</li>
            <ul>
                <li>Bus</li>
                <li>Car</li>
            </ul>
            <li>Water transport</li>
            <ul type="square">
                <li>Ship</li>
                <li>Boat</li>
                </ul>
                <li>Air transport</li>
                <ul type=""circle">
                <li>Aeroplane</li>
            <li>Helicopter</li>
        </ul>
        </ol>
    </body>
</html>
